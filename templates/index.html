<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok English Sphere</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="app-container">
        <div id="sphere" class="idle">
            <div class="light-reflection"></div>
        </div>

        <div class="chat-interface">
            <h2 id="status">Tap the Sphere to Practice</h2>
            <p id="transcript">Your speech will appear here...</p>
            <p id="ai-response">Grok's reply will appear here...</p>
        </div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
